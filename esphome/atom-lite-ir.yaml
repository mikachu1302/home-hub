# IR bridge for M5Stack ATOM Lite (ESP32) -> Onkyo A-9050 (and later more IR gear)
#
# Pins (confirmed on M5Stack's ATOM Lite docs page, 2026-11-10):
#   IR LED (built in)        GPIO12, behind the top cover (not next to the USB port)
#   Grove port signal pins   GPIO32 and GPIO26
# Which Grove pin carries the Unit IR's receiver is NOT documented: GPIO32 is
# tried first; if the log stays silent, swap GPIO32 and GPIO26 below.
#
# Flow:
#   1. Flashed; volume, mute and power confirmed on the A-9050 (2026-11-11).
#      Range is short (well under 1 m): place the ATOM close to the amp, top facing it.
#   2. Once the Unit IR is here: point the ORIGINAL remote at it and compare the
#      log ("Received NEC: address=…, command=…") with the codes below; add any
#      keys the database lacks.

esphome:
  name: ir-bridge
  friendly_name: IR Bridge

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ir-bridge-fallback"
    password: !secret fallback_ap_password

# Lets you re-enter the Wi-Fi details through the fallback hotspot.
captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  local: true        # serve the web page from the device, no internet needed
  auth:
    type: digest     # password is not sent in clear; also ESPHome's default from 2027.1
    username: !secret web_username
    password: !secret web_password

# --- IR out (built-in LED) ---------------------------------------------------
remote_transmitter:
  pin: GPIO12
  carrier_duty_percent: 50%
  non_blocking: true

# --- IR in (Unit IR receiver on the Grove port) - for learning only -----------
# Harmless while the Unit IR is not plugged in (the pull-up keeps the pin idle).
remote_receiver:
  pin:
    number: GPIO32
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 25%

# --- Onkyo codes ---------------------------------------------------------------
# Onkyo NEC codes are "D2 <device id>" + a key number. The classic amplifier id 6D
# (most databases) does NOT work on the A-9050; id 03 does (found with a sweep over
# all ids, 2026-11-11), matching Flipper-IRDB's "ONKYO/A-Serie.ir" (integrated amps),
# which also uses id 04 for some keys. ESPHome sends low byte first, so "D2 03" is
# 0x03D2, and key k is the command (~k << 8) | k: Volume Down 0x03 -> 0xFC03.
substitutions:
  onkyo: "0x03D2"
  onkyo4: "0x04D2"

# The HTTP path uses the button NAME (URL-encoded), as of ESPHome 2026.10:
#   "Amp Volume Up" -> POST /button/Amp%20Volume%20Up/press  (send an empty body:
#   the bridge rejects a POST without Content-Length)
# If you rename a button, the URL changes with it (and the app's key list too).
button:
  - platform: template
    name: "Amp Volume Up"       # 03/02, confirmed
    on_press:
      - remote_transmitter.transmit_nec: {address: "${onkyo}", command: 0xFD02}
  - platform: template
    name: "Amp Volume Down"     # 03/03, confirmed
    on_press:
      - remote_transmitter.transmit_nec: {address: "${onkyo}", command: 0xFC03}

  - platform: template
    name: "Amp Mute"            # 03/05, confirmed (toggle)
    on_press:
      - remote_transmitter.transmit_nec: {address: "${onkyo}", command: 0xFA05}
  - platform: template
    name: "Amp Power"           # 04/CB, confirmed (toggle; 03/04 and 04/47 "OFF" do nothing)
    on_press:
      - remote_transmitter.transmit_nec: {address: "${onkyo4}", command: 0x34CB}
  # Inputs: none of the A-Serie input codes (03/1B, 03/15, 03/46, 04/1E, 04/1F) work on
  # the A-9050; capture them from the original remote with the Unit IR.

  # Makes the IR LED glow for ~3 s so a phone camera can see it; no valid code, no device reacts.
  # The LED sits on the top, not next to the USB port.
  - platform: template
    name: "Test IR LED"
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [200000, -100000]
          repeat: {times: 10, wait_time: 100ms}
