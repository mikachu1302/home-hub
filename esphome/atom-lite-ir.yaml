# IR bridge for M5Stack ATOM Lite (ESP32) -> Onkyo A-9050 (and later more IR gear)
#
# Pins (M5Stack's ATOM Lite and Unit IR docs; confirmed on the hardware 2026-11-14):
#   IR LED (built in)        GPIO12, behind the top cover (not used: too weak)
#   Grove port signal pins   GPIO32 and GPIO26
#   Unit IR: LED on GPIO26 (yellow wire), receiver on GPIO32 (white wire)
#
# Flow:
#   1. Flashed; volume, mute and power confirmed on the A-9050 (2026-11-11).
#      Range is short (well under 1 m): place the ATOM close to the amp, top facing it.
#   2. Once the Unit IR is here: point the ORIGINAL remote at it and compare the
#      log ("Received NEC: address=…, command=…") with the codes below; add any
#      keys the database lacks.

esphome:
  name: ir-bridge
  friendly_name: IR Bridge

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ir-bridge-fallback"
    password: !secret fallback_ap_password

# Lets you re-enter the Wi-Fi details through the fallback hotspot.
captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  local: true        # serve the web page from the device, no internet needed
  auth:
    type: digest     # password is not sent in clear; also ESPHome's default from 2027.1
    username: !secret web_username
    password: !secret web_password

# --- IR out (built-in LED) ---------------------------------------------------
# Everything is sent through the Unit IR's LED (Grove yellow wire), which can sit right at the
# amp's IR window on a Grove cable. The ATOM's built-in LED (GPIO12) is not used: it is too weak
# to reach the amp from a hidden spot, and so is the Unit's, hence the cable.
remote_transmitter:
  pin: GPIO26
  carrier_duty_percent: 50%
  non_blocking: true

# --- IR in (Unit IR receiver on the Grove port) - for learning only -----------
# Harmless while the Unit IR is not plugged in (the pull-up keeps the pin idle).
remote_receiver:
  pin:
    number: GPIO32
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 25%

# --- Onkyo codes ---------------------------------------------------------------
# Onkyo NEC codes are "D2 <device id>" + a key number. The classic amplifier id 6D
# (most databases) does NOT work on the A-9050; id 03 does (found with a sweep over
# all ids, 2026-11-11), matching Flipper-IRDB's "ONKYO/A-Serie.ir" (integrated amps),
# which also uses id 04 for some keys. ESPHome sends low byte first, so "D2 03" is
# 0x03D2, and key k is the command (~k << 8) | k: Volume Down 0x03 -> 0xFC03.
substitutions:
  onkyo: "0x03D2"
  onkyo4: "0x04D2"

# The HTTP path uses the button NAME (URL-encoded), as of ESPHome 2026.10:
#   "Amp Volume Up" -> POST /button/Amp%20Volume%20Up/press  (send an empty body:
#   the bridge rejects a POST without Content-Length)
# If you rename a button, the URL changes with it (and the app's key list too).
button:
  - platform: template
    name: "Amp Volume Up"       # 03/02, confirmed
    on_press:
      - remote_transmitter.transmit_nec: {address: "${onkyo}", command: 0xFD02}
  - platform: template
    name: "Amp Volume Down"     # 03/03, confirmed
    on_press:
      - remote_transmitter.transmit_nec: {address: "${onkyo}", command: 0xFC03}

  - platform: template
    name: "Amp Mute"            # 03/05, confirmed (toggle)
    on_press:
      - remote_transmitter.transmit_nec: {address: "${onkyo}", command: 0xFA05}
  - platform: template
    name: "Amp Power"           # 04/CB, confirmed (toggle; 03/04 and 04/47 "OFF" do nothing)
    on_press:
      - remote_transmitter.transmit_nec: {address: "${onkyo4}", command: 0x34CB}
  # Inputs (captured from the original remote, 2026-11-14): 04/1E and 04/1F, but the remote
  # sends them as a short hold (frame + NEC repeat codes) and the amp ignores a bare frame.
  # So these are raw: the NEC frame, then two repeat codes 108 ms apart.
  - platform: template
    name: "Amp Input Next"      # 04/1E + repeats
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [9000, -4500, 560, -560, 560, -1690, 560, -560, 560, -560, 560, -1690, 560, -560, 560, -1690, 560, -1690, 560, -560, 560, -560, 560, -1690, 560, -560, 560, -560, 560, -560, 560, -560, 560, -560, 560, -560, 560, -1690, 560, -1690, 560, -1690, 560, -1690, 560, -560, 560, -560, 560, -560, 560, -1690, 560, -560, 560, -560, 560, -560, 560, -560, 560, -1690, 560, -1690, 560, -1690, 560, -43410, 9000, -2250, 560, -96190, 9000, -2250, 560]
  - platform: template
    name: "Amp Input Previous"  # 04/1F + repeats
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [9000, -4500, 560, -560, 560, -1690, 560, -560, 560, -560, 560, -1690, 560, -560, 560, -1690, 560, -1690, 560, -560, 560, -560, 560, -1690, 560, -560, 560, -560, 560, -560, 560, -560, 560, -560, 560, -1690, 560, -1690, 560, -1690, 560, -1690, 560, -1690, 560, -560, 560, -560, 560, -560, 560, -560, 560, -560, 560, -560, 560, -560, 560, -560, 560, -1690, 560, -1690, 560, -1690, 560, -43410, 9000, -2250, 560, -96190, 9000, -2250, 560]

  # --- Hisense TV (58A6FG, VIDAA). Its remote is Bluetooth only, but the TV accepts IR (Mute and
  # Volume Down confirmed 2026-11-14). Codes: Flipper-IRDB's VIDAA sets (Hisense_32A4HAU, _55E7KQ,
  # identical): NECext address 00 BF (0xBF00), key k as (~k << 8) | k.
  - platform: template
    name: "TV Power"        # toggle, like the remote's power key
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xF20D}
  - platform: template
    name: "TV Source"        # opens the input menu
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xED12}
  - platform: template
    name: "TV Up"
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xE916}
  - platform: template
    name: "TV Down"
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xE817}
  - platform: template
    name: "TV Left"
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xE619}
  - platform: template
    name: "TV Right"
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xE718}
  - platform: template
    name: "TV OK"
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xEA15}
  - platform: template
    name: "TV Back"
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xB748}
  - platform: template
    name: "TV Mute"        # confirmed 2026-11-14
    on_press:
      - remote_transmitter.transmit_nec: {address: 0xBF00, command: 0xF10E}

  # Makes the Unit IR's LED glow for ~3 s so a phone camera can see it (for aiming); no valid
  # code, no device reacts.
  - platform: template
    name: "Test IR LED"
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [200000, -100000]
          repeat: {times: 10, wait_time: 100ms}
